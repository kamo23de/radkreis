name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax prüfen
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
      - name: Tests
        run: npm test
